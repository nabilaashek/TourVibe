{% extends 'base.html' %}
{% block title %}Delete {{ tour.name }}{% endblock %}
{% block content %}
<div class="container auth-wrap py-5">
  <div class="card-soft auth-card text-center">
    <i class="bi bi-exclamation-triangle text-danger" style="font-size:2.5rem"></i>
    <h1 class="h4 fw-bold mt-2">Delete {{ tour.name }}?</h1>
    <p class="text-muted">This also deletes its photos and reviews. If tour packages use this place, it will be hidden instead.</p>
    <form method="post" class="d-flex gap-2 justify-content-center">{% csrf_token %}
      <a href="{{ tour.get_absolute_url }}" class="btn btn-light">Cancel</a>
      <button class="btn btn-danger">Yes, delete</button>
    </form>
  </div>
</div>
{% endblock %}
